name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.pick.outputs.run_backend }}
      run_frontend: ${{ steps.pick.outputs.run_frontend }}
      run_docker: ${{ steps.pick.outputs.run_docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
            frontend:
              - 'Frontend/**'
            docker:
              - 'docker-compose.yml'
              - 'Backend/Dockerfile'
              - 'Backend/.dockerignore'
              - 'Frontend/Dockerfile'
              - 'Frontend/.dockerignore'
              - 'Backend/**'
              - 'Frontend/**'
            workflow:
              - '.github/**'
            repo_wide:
              - 'spec/**'
              - '*.md'
              - 'docs/**'

      - name: Decide which jobs to run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            echo "run_docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          b="${{ steps.filter.outputs.backend }}"
          f="${{ steps.filter.outputs.frontend }}"
          d="${{ steps.filter.outputs.docker }}"
          w="${{ steps.filter.outputs.workflow }}"
          r="${{ steps.filter.outputs.repo_wide }}"
          run_b=false
          run_f=false
          run_d=false
          if [ "$b" = "true" ] || [ "$w" = "true" ] || [ "$r" = "true" ]; then run_b=true; fi
          if [ "$f" = "true" ] || [ "$w" = "true" ] || [ "$r" = "true" ]; then run_f=true; fi
          if [ "$d" = "true" ] || [ "$w" = "true" ]; then run_d=true; fi
          echo "run_backend=$run_b" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$run_f" >> "$GITHUB_OUTPUT"
          echo "run_docker=$run_d" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Gradle test)
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Spotless check (format, unused imports)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

  frontend:
    name: Frontend (build)
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose (build and integration test)
    needs: changes
    if: needs.changes.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: |
          echo "Starting docker compose build and up..."
          docker compose up --build -d
          echo "Services started"

      - name: Wait for Backend to be ready
        run: |
          echo "Waiting for Backend (:8080) to respond..."
          timeout=120
          elapsed=0
          while ! curl -sf http://localhost:8080/docs.html > /dev/null; do
            if [ $elapsed -ge $timeout ]; then
              echo "Backend did not become ready within ${timeout}s"
              docker compose logs backend
              exit 1
            fi
            echo "Waiting for backend... (${elapsed}s)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Backend is ready"

      - name: Wait for Frontend to be ready
        run: |
          echo "Waiting for Frontend (:3333) to respond..."
          timeout=60
          elapsed=0
          while ! curl -sf http://localhost:3333 > /dev/null; do
            if [ $elapsed -ge $timeout ]; then
              echo "Frontend did not become ready within ${timeout}s"
              docker compose logs frontend
              exit 1
            fi
            echo "Waiting for frontend... (${elapsed}s)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Frontend is ready"

      - name: Load quickstart sample scenario and start simulation
        run: |
          echo "Loading quickstart sample scenario..."
          response=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d @Backend/docs/test-data/quickstart-arrival-sample.json \
            http://localhost:3333/api/scenario/load)
          echo "Scenario load response: $response"
          
          echo "Starting simulation..."
          curl -sf -X POST http://localhost:3333/api/simulation/start
          echo "Simulation started"
          
          sleep 5

      - name: Verify aircraft count
        run: |
          echo "Fetching aircraft location data..."
          response=$(curl -sf http://localhost:3333/api/aircraft/location/all)
          echo "Response: $response"
          
          count=$(echo "$response" | jq '. | length')
          echo "Aircraft count: $count"
          
          if [ "$count" -ne 5 ]; then
            echo "Expected 5 aircraft, got $count"
            exit 1
          fi
          
          echo "Verification passed: 5 aircraft found"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== Frontend logs ==="
          docker compose logs frontend

      - name: Stop services
        if: always()
        run: docker compose down
