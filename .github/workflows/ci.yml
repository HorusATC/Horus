name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.pick.outputs.run_backend }}
      run_frontend: ${{ steps.pick.outputs.run_frontend }}
      run_docker: ${{ steps.pick.outputs.run_docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
            frontend:
              - 'Frontend/**'
            docker:
              - 'docker-compose.yml'
              - 'Backend/Dockerfile'
              - 'Backend/.dockerignore'
              - 'Frontend/Dockerfile'
              - 'Frontend/.dockerignore'
              - 'Backend/**'
              - 'Frontend/**'
              - 'scripts/**'
            workflow:
              - '.github/**'
            repo_wide:
              - 'spec/**'
              - '*.md'
              - 'docs/**'
              - 'scripts/**'

      - name: Decide which jobs to run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            echo "run_docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          b="${{ steps.filter.outputs.backend }}"
          f="${{ steps.filter.outputs.frontend }}"
          d="${{ steps.filter.outputs.docker }}"
          w="${{ steps.filter.outputs.workflow }}"
          r="${{ steps.filter.outputs.repo_wide }}"
          run_b=false
          run_f=false
          run_d=false
          if [ "$b" = "true" ] || [ "$w" = "true" ] || [ "$r" = "true" ]; then run_b=true; fi
          if [ "$f" = "true" ] || [ "$w" = "true" ] || [ "$r" = "true" ]; then run_f=true; fi
          # scripts/** is also in the docker filter so verify-quickstart live checks run
          # when quickstart scripts change (repo_wide alone would skip Docker).
          if [ "$d" = "true" ] || [ "$w" = "true" ]; then run_d=true; fi
          echo "run_backend=$run_b" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$run_f" >> "$GITHUB_OUTPUT"
          echo "run_docker=$run_d" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Gradle test)
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Spotless check (format, unused imports)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Check for disabled tests
        run: |
          if grep -rE '^\s*@Disabled\b' src/test --include='*.java' | grep -v '@DisabledIfEnvironmentVariable'; then
            echo "Error: Found @Disabled tests (only @DisabledIfEnvironmentVariable with reason is allowed)"
            exit 1
          fi

      - name: Run tests
        run: ./gradlew test --no-daemon

  frontend:
    name: Frontend (build)
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify quickstart README contract
        working-directory: .
        run: bash scripts/verify-quickstart.sh --readme-only

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check Tailwind content coverage
        run: npm run tailwind:check

      - name: Check for disabled/focused tests
        run: |
          if grep -rE '^\s*(describe|it|test)\.(skip|only)\(|^\s*(x(describe|it|test)|f(describe|it|test))\(' . --include='*.test.ts' --include='*.test.tsx' --include='*.spec.ts' --include='*.spec.tsx' --exclude-dir=node_modules --exclude-dir=.next; then
            echo "Error: Found .skip(), .only(), xit(), fit(), xdescribe(), fdescribe(), or xtest() in tests"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose (build and integration test)
    needs: changes
    if: needs.changes.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: |
          echo "Starting docker compose build and up..."
          docker compose up --build -d
          echo "Services started"

      - name: Wait for Backend to be ready
        run: |
          echo "Waiting for Backend (:8080) to respond..."
          timeout=120
          elapsed=0
          while ! curl -sf http://localhost:8080/docs.html > /dev/null; do
            if [ $elapsed -ge $timeout ]; then
              echo "Backend did not become ready within ${timeout}s"
              docker compose logs backend
              exit 1
            fi
            echo "Waiting for backend... (${elapsed}s)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Backend is ready"

      - name: Wait for Frontend to be ready
        run: |
          echo "Waiting for Frontend (:3333) to respond..."
          timeout=60
          elapsed=0
          while ! curl -sf http://localhost:3333 > /dev/null; do
            if [ $elapsed -ge $timeout ]; then
              echo "Frontend did not become ready within ${timeout}s"
              docker compose logs frontend
              exit 1
            fi
            echo "Waiting for frontend... (${elapsed}s)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Frontend is ready"

      - name: Verify quickstart live checks (2–4)
        run: |
          # Reuses already-up Compose services; adds homepage text + position-change
          # checks without a second stack. Cost is a few curl/sleep seconds.
          bash scripts/verify-quickstart.sh --live

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== Frontend logs ==="
          docker compose logs frontend

      - name: Stop services
        if: always()
        run: docker compose down
