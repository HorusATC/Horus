openapi: '3.0.2'
info:
  title: Uranos API Documentation
  version: 'v1.0.0'
servers:
  - url: "http://localhost:8080"
    description: "Local server"
tags:
  - name: "startGame"
    description: "Start a new game."
  - name: "inGame"
    description: "In game actions."
  - name: "endGame"
    description: "End a game."
  - name: "aircraft"
    description: "Aircraft location and status information."
  - name: "scenario"
    description: "Scenario load and management."
  - name: "simulation"
    description: "Simulation run/pause, status, and wall-clock speed multiplier."
paths:
  "/startGame":
    post:
      tags: ["startGame"]
      summary: "OUTDATED: Start a new game."
      description: "OUTDATED: This endpoint does not exist in the current implementation. Use /simulation/start instead."
      deprecated: true
      requestBody:
        description: "Initial value of airspace. The initial value is sent from the front desk. To be able to read scenario files."
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["areaInfo"]
              properties:
                areaInfo:
                  type: "array"
                  description: "Initial value of airspace."
                  items:
                    $ref: "#/components/schemas/Flight"

      responses:
        "200":
          description: "Game started."

        "400":
          description: "Bad request."
          content:
            application/json:
              schema:
                type: "object"
                example:
                  message: Bad request
                  details: Error message indicating which property is missing.
                properties:
                  message:
                    type: string
                  details:
                    type: string

  "/aircraft/location/all":
    get:
      tags: ["aircraft"]
      summary: "Get all aircraft locations and status"
      description: "Returns detailed information for all aircraft including position, vector, instructed vector, and risk level in JSON format."
      deprecated: false
      responses:
        "200":
          description: "Aircraft location data retrieved successfully"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AircraftLocation"

  "/api/aircraft/spawn-with-flightplan":
    post:
      tags: ["aircraft"]
      summary: "Spawn aircraft with flight plan"
      description: "Creates a new aircraft with an initial position and flight plan for automatic navigation."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpawnWithFlightPlan"
      responses:
        "200":
          description: Aircraft spawned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  callsign:
                    type: string
                  message:
                    type: string
        "400":
          description: Bad request (e.g. aircraft already exists)

  "/api/aircraft/{callsign}/flightplan":
    get:
      tags: ["aircraft"]
      summary: "Get aircraft flight plan status"
      description: "Returns the current flight plan status including navigation mode and remaining waypoints."
      parameters:
        - name: callsign
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flight plan status
          content:
            application/json:
              schema:
                type: object
                properties:
                  callsign:
                    type: string
                  navigationMode:
                    type: string
                  currentWaypointIndex:
                    type: integer
                  currentWaypoint:
                    type: string
                  remainingWaypoints:
                    type: array
                    items:
                      type: string
    post:
      tags: ["aircraft"]
      summary: "Assign flight plan to aircraft"
      description: "Assigns a flight plan to an existing aircraft."
      parameters:
        - name: callsign
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightPlanDto"
      responses:
        "200":
          description: Flight plan assigned

  "/api/aircraft/{callsign}/direct-to":
    post:
      tags: ["aircraft"]
      summary: "Direct aircraft to fix"
      description: "Instructs the aircraft to fly direct to the specified fix. Optionally resume flight plan after reaching the fix."
      parameters:
        - name: callsign
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixName]
              properties:
                fixName:
                  type: string
                resumeFlightPlan:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Direct to instruction applied

  "/api/aircraft/{callsign}/go-around":
    post:
      tags: ["aircraft"]
      summary: "Go around on runway heading"
      description: "Abandons the approach and climbs on the runway heading. Climb altitude must be at least 500 ft above the current altitude. Aircraft more than 120 NM from the threshold are rejected."
      parameters:
        - name: callsign
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [airportIcao, runwayDesignator, climbAltitudeFt]
              properties:
                airportIcao:
                  type: string
                runwayDesignator:
                  type: string
                climbAltitudeFt:
                  type: integer
                  minimum: 1000
                  maximum: 45000
      responses:
        "200":
          description: Go-around applied
        "400":
          description: Unknown runway, climb too low, or aircraft too far from the threshold

  "/api/aircraft/{callsign}/tower-handoff":
    post:
      tags: ["aircraft"]
      summary: "Hand off to the tower"
      description: "Releases an aircraft established on the final approach course to the tower. The aircraft must be in HEADING mode and within 10 NM of the threshold. The predicted track uses the same heading, indicated-airspeed conversion, vertical speed, and position step as a live tick, and must pass within 0.5 NM of the threshold. Inside 0.5 NM the track check is skipped, but HEADING mode is still required. After acceptance, approach instructions return 409. The aircraft is removed within 0.5 NM of the threshold. Go-around, a non-heading mode, a track that misses the threshold, and aircraft farther than 10 NM return 400."
      parameters:
        - name: callsign
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [airportIcao, runwayDesignator]
              properties:
                airportIcao:
                  type: string
                runwayDesignator:
                  type: string
      responses:
        "200":
          description: Tower handoff accepted
        "400":
          description: Unknown runway, or the aircraft is not established on that final
        "409":
          description: The aircraft has already been handed off to the tower

  "/api/aircraft/{callsign}/resume-navigation":
    post:
      tags: ["aircraft"]
      summary: "Resume own navigation"
      description: "Instructs the aircraft to resume flight plan navigation (resume own navigation)."
      parameters:
        - name: callsign
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resume navigation applied

  "/api/aircraft/{callsign}/hold":
    post:
      tags: ["aircraft"]
      summary: "Hold at fix"
      description: >
        Instructs the aircraft to proceed to the fix and fly a racetrack hold.
        Omitting optional fields preserves historical behaviour: RIGHT turns, 4.0 NM outbound leg,
        and a fix-name-hash inbound course (not an operational course). Operator clients should
        always send inboundCourseDeg.
      parameters:
        - name: callsign
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldRequest"
            examples:
              compatibleDefault:
                value:
                  fixName: ABENO
                  turnDirection: RIGHT
              leftTimed:
                value:
                  fixName: ABENO
                  inboundCourseDeg: 209
                  legMinutes: 1.5
                  turnDirection: LEFT
              distanceLeg:
                value:
                  fixName: ABENO
                  inboundCourseDeg: 90
                  legNm: 7
                  turnDirection: RIGHT
      responses:
        "200":
          description: Hold instruction applied
        "400":
          description: >
            Invalid turnDirection, inboundCourseDeg outside [0, 360), both legMinutes and legNm,
            non-positive or out-of-bound leg, or timed leg with ground speed below 1 kt

  "/api/atis":
    get:
      tags: ["atis"]
      summary: "Get ATIS / runway-in-use state"
      description: >
        Returns session ATIS state for each airport that has runway catalog entries.
        Defaults are 16R / information A with wind missing (windAvailable false).
        availableRunways lists surveyed catalog ends (RJTT A/B/C/D and RJAA A/B).
        Session-wide wind is shared across airports; windDirectionDeg and windSpeedKt
        appear when wind is observed (calm or measured). QNH and visibility are not modelled.
        Scenario load resets state to defaults.
      responses:
        "200":
          description: ATIS state array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtisState"

  "/api/atis/{airportIcao}":
    put:
      tags: ["atis"]
      summary: "Update runway in use / ATIS information ident / session wind"
      description: >
        Sets the runway in use for a catalog airport. Optional wind object updates
        session-wide wind (true degrees from, speed 0–99 kt). Omit wind to leave wind
        unchanged; JSON null clears wind to missing. When wind observation changes,
        information ident advances on all catalog airports once (FAA 2-9-2). Re-sending
        the same wind does not advance ident. When runwayInUse changes and wind is
        unchanged and informationIdent is omitted, only that airport's ident advances.
        Optional informationIdent sets the letter explicitly on the target airport.
        Unknown airport or runway → 400. Invalid wind → 400.
      parameters:
        - name: airportIcao
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAtisRequest"
            examples:
              changeRunway:
                value:
                  runwayInUse: "34L"
              setIdent:
                value:
                  runwayInUse: "16R"
                  informationIdent: "C"
              setWind:
                value:
                  runwayInUse: "16R"
                  wind:
                    directionDeg: 160
                    speedKt: 12
              clearWind:
                value:
                  runwayInUse: "16R"
                  wind: null
      responses:
        "200":
          description: Updated ATIS state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtisState"
        "400":
          description: Unknown airport/runway, or invalid informationIdent

  "/api/scenario/load":
    post:
      tags: ["scenario"]
      summary: "Load scenario"
      description: "Loads a scenario with multiple aircraft. Clears the current airspace and spawns all aircraft with their flight plans. Resets ATIS / runway-in-use to defaults. Duplicate callsigns or invalid fixes in routes return 400."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioLoad"
      responses:
        "200":
          description: Scenario loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  scenarioName:
                    type: string
                  aircraftCount:
                    type: integer
                  message:
                    type: string
        "400":
          description: Bad request (empty aircraft, duplicate callsign, fix not found)

  "/simulation/start":
    post:
      tags: ["simulation"]
      summary: "Start simulation"
      responses:
        "200":
          description: Simulation running flag set to true

  "/simulation/pause":
    post:
      tags: ["simulation"]
      summary: "Pause simulation"
      responses:
        "200":
          description: Simulation running flag set to false

  "/simulation/status":
    get:
      tags: ["simulation"]
      summary: "Simulation status and timing"
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationStatus"

  "/simulation/speed":
    get:
      tags: ["simulation"]
      summary: "Get speed multiplier and wall-clock tick interval"
      responses:
        "200":
          description: Current speed settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationSpeed"
    put:
      tags: ["simulation"]
      summary: "Set speed multiplier (discrete presets only)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationSpeedRequest"
      responses:
        "200":
          description: Speed updated; scheduler rescheduled
        "400":
          description: Invalid multiplier (must be 0.25, 0.5, 1, 2, 4, or 10)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationSpeedError"

  "/aircraft/location":
    get:
      tags: ["aircraft"]
      summary: "Get specific aircraft location and status"
      description: "Returns detailed information for a specific aircraft by callsign including risk level in JSON format."
      deprecated: false
      parameters:
        - name: callsign
          in: query
          required: true
          schema:
            type: string
          description: "The callsign of the aircraft to retrieve"
          example: "JAL512"
      responses:
        "200":
          description: "Aircraft location data retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AircraftLocation"
        "400":
          description: "Aircraft not found or bad request"
          content:
            text/plain:
              schema:
                type: string
                example: "Aircraft with callsign JAL512 does not exist."

  "/inGame":
    get:
      tags: ["inGame"]
      summary: "Get the current area infomation."
      description: "Get the current area infomation like air plane position, altitude, heading, etc."
      deprecated: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  gameState:
                    type: "array"
                    description: "Current state of the game."
                    items:
                      $ref: "#/components/schemas/Flight"

        "400":
          description: "Bad request."
          content:
            application/json:
              schema:
                type: "object"
                example:
                  message: Bad request
                  details: Error message indicating which property is missing.
                properties:
                  message:
                    type: string
                  details:
                    type: string
    post:
      tags: ["inGame"]
      summary: "Give instructions to the pilot."
      description: Update the altitude, heading, and/or speed of a specified aircraft using its callsign.
      deprecated: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - callsign
              properties:
                callsign:
                  type: string
                  description: The callsign of the aircraft to update.
                altitude:
                  type: integer
                  description: The new altitude for the aircraft in feet. Optional.
                heading:
                  type: integer
                  description: The new heading for the aircraft in degrees (0-360). Optional.
                gspeed:
                  type: integer
                  description: The new ground speed for the aircraft in knots. Optional.
              example:
                callsign: "AAL123"
                altitude: 30000
                heading: 180
                gspeed: 450
      responses:
        '200':
          description: Flight parameters updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Flight parameters updated successfully."
        '400':
          description: Invalid input or missing required fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid input or missing required fields."
        '404':
          description: Aircraft not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Aircraft not found."
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error."

components:
  schemas:
    AtisState:
      type: object
      required:
        [airportIcao, airportName, runwayInUse, informationIdent, text, availableRunways, windAvailable]
      properties:
        airportIcao:
          type: string
          example: RJTT
        airportName:
          type: string
          example: Tokyo International Airport
        runwayInUse:
          type: string
          example: "16R"
        informationIdent:
          type: string
          pattern: "^[A-Z]$"
          example: A
        text:
          type: string
          description: Composed ATIS text including wind when observed; QNH not invented.
        windAvailable:
          type: boolean
          description: false when wind is missing; true for calm or measured wind.
        windDirectionDeg:
          type: integer
          minimum: 1
          maximum: 360
          description: True wind from-direction; omitted when missing or calm.
        windSpeedKt:
          type: integer
          minimum: 0
          maximum: 99
          description: Wind speed in knots; 0 when calm; omitted when missing.
        availableRunways:
          type: array
          items:
            type: string
          example: ["16R", "34L", "16L", "34R", "04", "22", "05", "23"]
    UpdateAtisRequest:
      type: object
      required: [runwayInUse]
      properties:
        runwayInUse:
          type: string
          description: Catalog runway designator for the airport
        informationIdent:
          type: string
          pattern: "^[A-Za-z]$"
          description: Optional explicit information letter. When omitted, advances only if runwayInUse changes.
        wind:
          type: object
          nullable: true
          description: >
            Optional session wind. Omitted leaves wind unchanged. null clears to missing.
            speedKt 0 means calm (direction ignored). speedKt 1–99 requires directionDeg 1–360.
          properties:
            directionDeg:
              type: integer
              minimum: 1
              maximum: 360
            speedKt:
              type: integer
              minimum: 0
              maximum: 99
    HoldRequest:
      type: object
      required: [fixName]
      properties:
        fixName:
          type: string
          description: Holding fix name
        turnDirection:
          type: string
          enum: [LEFT, RIGHT]
          default: RIGHT
          description: Racetrack turn direction (RIGHT when omitted)
        inboundCourseDeg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Instructed inbound course in degrees [0, 360). When omitted, uses the historical fix-name hash.
        legMinutes:
          type: number
          exclusiveMinimum: 0
          maximum: 30
          description: Timed outbound leg in minutes. Mutually exclusive with legNm. Distance = groundSpeedKt × (minutes / 60).
        legNm:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          description: Outbound leg distance in NM. Mutually exclusive with legMinutes. Default 4.0 when both omitted.
    AircraftLocation:
      type: object
      properties:
        callsign:
          type: string
        position:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
            altitude:
              type: number
        vector:
          type: object
          properties:
            heading:
              type: number
              description: Aircraft heading (degrees)
            groundSpeed:
              type: number
            verticalSpeed:
              type: number
            track:
              type: number
              description: Ground track (degrees); equals heading when wind is missing or calm.
        instructedVector:
          type: object
          properties:
            heading:
              type: number
            groundSpeed:
              type: number
            altitude:
              type: number
        type:
          type: string
        model:
          type: string
        originIata:
          type: string
        originIcao:
          type: string
        destinationIata:
          type: string
        destinationIcao:
          type: string
        eta:
          type: string
        riskLevel:
          type: number
        navigationMode:
          type: string
          description: HEADING / FLIGHT_PLAN / DIRECT_TO / HOLDING
        squawk:
          type: string
          nullable: true
        goAround:
          type: boolean
        towerHandoff:
          type: boolean
        msawAlert:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum: [MSA, LOW]
            msaFt:
              type: number
            trigger:
              type: string
              enum: [CURRENT, PREDICTED]
        holding:
          type: object
          nullable: true
          description: >
            Present only while navigationMode is HOLDING. Omitted for non-holding aircraft.
            Pattern vertices come from the same backend racetrack geometry that drives flight.
          properties:
            fixName:
              type: string
            fixLatitude:
              type: number
            fixLongitude:
              type: number
            inboundCourseDeg:
              type: number
            turnDirection:
              type: string
              enum: [LEFT, RIGHT]
            legMinutes:
              type: number
              nullable: true
            legNm:
              type: number
              nullable: true
            outboundLegNm:
              type: number
            turnRateDegPerSec:
              type: number
            turnRadiusNm:
              type: number
            pattern:
              type: array
              minItems: 2
              items:
                type: object
                required: [latitude, longitude]
                properties:
                  latitude:
                    type: number
                  longitude:
                    type: number
            entryProcedure:
              type: string
              nullable: true
              enum: [DIRECT, TEARDROP, PARALLEL]
              description: >
                AIM 5-3-8 entry sector from arrival heading at the fix.
                Predicted before first passage; frozen afterward.
    Flight:
      type: "object"
      example:
        callsign: "AAL123"
        latitude: 35.553333
        longitude: 139.781113
        heading: 150
        altitude: 35000
        gspeed: 250
        vspeed: 340
        type: "B777"
        orig_iata: "HND"
        orig_icao: "RJTT"
        dest_iata: "LAX"
        dest_icao: "KLAX"
        eta: "2024-05-21T12:00:00Z"
      properties:
        callsign:
          type: "string"
          description: "Each airplane's callsign."
        latitude:
          type: "number"
          format: "float"
          description: "Each airplane's latitude."
        longitude:
          type: "number"
          format: "float"
          description: "Each airplane's longitude."
        heading:
          type: "integer"
          description: "True track (over ground) expressed in integer degrees as 0-360. Please note that 0 can in some cases mean unknown."
        altitude:
          type: integer
          description: Barometric pressure altitude above mean sea level (AMSL) reported at a standard atmospheric pressure (1013.25 hPa / 29.92 in. Hg.) expressed in feet.
        gspeed:
          type: integer
          description: Speed relative to the ground expressed in knots.
        vspeed:
          type: integer
          description: The rate at which the aircraft is ascending or descending in feet per minute.
        type:
          type: string
          nullable: true
          description: Aircraft ICAO type code.
        orig_iata:
          type: string
          example: ARN
          description: Origin airport IATA code
        orig_icao:
          type: string
          example: ESSA
          description: Origin airport ICAO code
        dest_iata:
          type: string
          example: ARN
          description: Destination airport IATA code
        dest_icao:
          type: string
          example: ESSA
          description: Destination airport ICAO code
        eta:
          type: string
          nullable: true
          description: Estimated time of arrival (ISO 8601 date format)

    SpawnWithFlightPlan:
      type: object
      required: [flightPlan, initialPosition]
      properties:
        flightPlan:
          $ref: "#/components/schemas/FlightPlanDto"
        initialPosition:
          $ref: "#/components/schemas/InitialPositionDto"
        spawnTime:
          type: integer
          nullable: true
          description: "Relative seconds from simulation start. null or 0 = immediate spawn. Reserved for future delayed spawn support."

    ScenarioLoad:
      type: object
      required: [aircraft]
      properties:
        scenarioName:
          type: string
        description:
          type: string
        createdAt:
          type: string
        aircraft:
          type: array
          items:
            $ref: "#/components/schemas/SpawnWithFlightPlan"

    FlightPlanDto:
      type: object
      required: [callsign, cruiseAltitude, cruiseSpeed]
      properties:
        callsign:
          type: string
        aircraftType:
          type: string
        departureAirport:
          type: string
        arrivalAirport:
          type: string
        cruiseAltitude:
          type: integer
        cruiseSpeed:
          type: integer
        route:
          type: array
          items:
            $ref: "#/components/schemas/FlightPlanWaypointDto"

    FlightPlanWaypointDto:
      type: object
      required: [fix]
      properties:
        fix:
          type: string
        altitude:
          type: integer
        constraint:
          type: string
          enum: [AT, AT_OR_ABOVE, AT_OR_BELOW, BETWEEN, NONE]
        speed:
          type: integer
        action:
          type: string
          enum: [CONTINUE, REMOVE_AIRCRAFT, HANDOFF]

    InitialPositionDto:
      type: object
      required: [latitude, longitude, altitude, heading, groundSpeed, verticalSpeed]
      properties:
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: integer
        heading:
          type: integer
        groundSpeed:
          type: integer
        verticalSpeed:
          type: integer

    SimulationStatus:
      type: object
      required: [isSimulationRunning, speedMultiplier, tickIntervalWallMs]
      properties:
        isSimulationRunning:
          type: boolean
        speedMultiplier:
          type: number
          description: "Wall-clock multiplier; 1 = one sim second per second of real time (tick every 1000 ms)."
        tickIntervalWallMs:
          type: integer
          description: "Approximate milliseconds between simulation ticks at current multiplier."

    SimulationSpeed:
