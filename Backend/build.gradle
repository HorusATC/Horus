plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.springdoc.openapi-gradle-plugin" version "1.8.0"
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'jp.ac.tohoku.qse.takahashi'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0"
	implementation 'org.springframework.boot:spring-boot-starter-validation'
}


tasks.named('test') {
	useJUnitPlatform()
}

// Committed sources: slice-1 + slice-3 AIP JSON → classpath fix/
tasks.named('processResources') {
	from("${projectDir}/../aip") {
		include 'rjtt-sid-star-20261101.json'
		include 'slice3-20261101.json'
		into 'fix'
	}
}

tasks.withType(JavaCompile).configureEach {
	if (it.name == 'compileJava') {
		options.compilerArgs += ['-Xlint:all', '-Werror']
	} else if (it.name == 'compileTestJava') {
		options.compilerArgs += ['-Xlint:all']
	}
}

bootRun {
	if (project.hasProperty('wpDebug')) {
		jvmArgs = ['-Dflightplan.wp.debug=true']
	}
}

spotless {
	java {
		removeUnusedImports()
		importOrder('java', 'javax', 'org', 'com', 'jp', '')
		trimTrailingWhitespace()
		endWithNewline()
	}
}
