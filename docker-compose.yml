version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - horus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs.html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        BACKEND_SERVER_IP: backend
        BACKEND_SERVER_PORT: 8080
    ports:
      - "3333:3333"
    environment:
      - BACKEND_SERVER_IP=backend
      - BACKEND_SERVER_PORT=8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - horus-network

networks:
  horus-network:
    driver: bridge
